<!doctype html>
<html>
	<head>
		<title>Course Lists</title>
	</head>
	<body>
		<h1>Course Lists</h1>

		<h2>Computer Science</h2>

		<label>Select a course:</label>
		<select>
			<option>Computer Science</option>
			<option>Data Structures</option>
			<option>Database Management</option>
			<option>Operating Systems</option>
			<option>Computer Networks</option>
		</select>

		<br /><br />

		<label>Search a course:</label>
		<input list="computer-courses" placeholder="Enter course name" />

		<datalist id="computer-courses">
			<option value="Computer Science"></option>
			<option value="Data Structures"></option>
			<option value="Database Management"></option>
			<option value="Operating Systems"></option>
			<option value="Computer Networks"></option>
		</datalist>

		<hr />

		<h2>Management</h2>

		<label>Select a course:</label>
		<select>
			<option>Business Management</option>
			<option>Marketing Management</option>
			<option>Financial Management</option>
			<option>Human Resource Management</option>
			<option>Operations Management</option>
		</select>

		<br /><br />

		<label>Search a course:</label>
		<input list="management-courses" placeholder="Enter course name" />

		<datalist id="management-courses">
			<option value="Business Management"></option>
			<option value="Marketing Management"></option>
			<option value="Financial Management"></option>
			<option value="Human Resource Management"></option>
			<option value="Operations Management"></option>
		</datalist>

		<hr />

		<h2>Science</h2>

		<label>Select a course:</label>
		<select>
			<option>Physics</option>
			<option>Chemistry</option>
			<option>Mathematics</option>
			<option>Biology</option>
			<option>Environmental Science</option>
		</select>

		<br /><br />

		<label>Search a course:</label>
		<input list="science-courses" placeholder="Enter course name" />

		<datalist id="science-courses">
			<option value="Physics"></option>
			<option value="Chemistry"></option>
			<option value="Mathematics"></option>
			<option value="Biology"></option>
			<option value="Environmental Science"></option>
		</datalist>
	</body>
</html>
